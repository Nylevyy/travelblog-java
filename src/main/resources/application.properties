server.port=${PORT}

spring.application.name=travelblog

spring.datasource.url=jdbc:postgresql://${DB_HOSTNAME}:${DB_PORT}/${DB_NAME}?useSSL=${DB_SSL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# liquibase
spring.liquibase.change-log=./db/changelog/changelog.json
spring.liquibase.url=jdbc:postgresql://${DB_HOSTNAME}:${DB_PORT}/${DB_NAME}?useSSL=${DB_SSL}
spring.liquibase.user=${DB_USERNAME}
spring.liquibase.password=${DB_PASSWORD}
